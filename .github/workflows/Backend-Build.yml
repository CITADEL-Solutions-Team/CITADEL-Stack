name: Backend Build & Test

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Backend/**'
  push:
    branches: [main]
    paths:
      - 'Backend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./cmd/citadel_server/.
      - run: go test ./...
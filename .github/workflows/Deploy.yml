name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: npm ci
        working-directory: ./Frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./Frontend

      - name: Check the build has a CSP meta tag
        run: grep -q 'content-security-policy' Frontend/dist/index.html || { echo "No CSP meta tag in build. Aborting."; exit 1; }

      - name: Create destination directory
        run: ssh citadel@10.10.20.31 "mkdir -p /var/www/releases/${{ github.sha }}"

      - name: Copy new build to frontend CT
        run: scp -r Frontend/dist/* citadel@10.10.20.31:/var/www/releases/${{ github.sha }}/

      - name: Verify release before switching
        run: |
          ssh citadel@10.10.20.31 "test -f /var/www/releases/${{ github.sha }}/index.html && test -f /var/www/releases/${{ github.sha }}/404.html" \
            || { echo "Release is missing index.html or 404.html. Aborting before switching."; exit 1; }

      - name: Record current release (for rollback)
        id: prev
        run: echo "path=$(ssh citadel@10.10.20.31 'readlink /var/www/current')" >> "$GITHUB_OUTPUT"

      - name: Update symlink
        run: ssh citadel@10.10.20.31 "ln -sfn /var/www/releases/${{ github.sha }} /var/www/current"

      - name: Smoke test the live site
        run: |
          RESOLVE="--resolve citadelsolutions.tech:443:10.10.20.31"
          BASE="https://citadelsolutions.tech"

          code=$(curl -s -o /dev/null -w '%{http_code}' $RESOLVE "$BASE/our-mission")
          [ "$code" = "200" ] || { echo "/our-mission returned $code, expected 200"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' $RESOLVE "$BASE/smoke-test-not-a-page")
          [ "$code" = "404" ] || { echo "Missing page returned $code, expected 404"; exit 1; }

          curl -s $RESOLVE "$BASE/" | grep -q 'content-security-policy' \
            || { echo "Live page has no CSP meta tag"; exit 1; }

          if curl -sI $RESOLVE "$BASE/" | grep -qi '^content-security-policy:'; then
            echo "nginx is sending a CSP header, which will block Astro's inline scripts"; exit 1
          fi

      - name: Roll back on failure
        if: failure() && steps.prev.outputs.path != ''
        run: ssh citadel@10.10.20.31 "ln -sfn ${{ steps.prev.outputs.path }} /var/www/current"

      - name: Clean up old releases (keep last 5)
        if: success()
        run: ssh citadel@10.10.20.31 "cd /var/www/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

  deploy-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o citadel-backend ./cmd/citadel_server
        working-directory: ./Backend

      - name: Get checksum of built binary
        id: local_sum
        run: echo "sum=$(sha256sum citadel-backend | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        working-directory: ./Backend

      - name: Copy new binary to backend CT
        run: scp Backend/citadel-backend deploy@10.10.20.32:/opt/citadel-backend/citadel-backend.new

      - name: Verify checksum on remote
        run: |
          REMOTE_SUM=$(ssh deploy@10.10.20.32 "sha256sum /opt/citadel-backend/citadel-backend.new | awk '{print \$1}'")
          if [ "$REMOTE_SUM" != "${{ steps.local_sum.outputs.sum }}" ]; then
            echo "Checksum mismatch! Aborting deploy."
            exit 1
          fi

      - name: Stop, backup, swap, start
        run: |
          ssh deploy@10.10.20.32 "doas /sbin/rc-service citadel-backend stop"
          ssh deploy@10.10.20.32 "cp /opt/citadel-backend/citadel-backend /opt/citadel-backend/citadel-backend.bak"
          ssh deploy@10.10.20.32 "mv /opt/citadel-backend/citadel-backend.new /opt/citadel-backend/citadel-backend"
          ssh deploy@10.10.20.32 "doas /sbin/rc-service citadel-backend start"

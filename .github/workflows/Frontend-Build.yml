name: Frontend Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'Frontend/**'
  push:
    branches: [main]
    paths:
      - 'Frontend/**'

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check the build has a CSP meta tag
        run: grep -q 'content-security-policy' dist/index.html || { echo "No CSP meta tag in build. Aborting."; exit 1; }
